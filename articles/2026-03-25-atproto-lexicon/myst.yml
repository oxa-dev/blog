  title: Scientific Documents as First-Class Objects on AT Protocol
  description: |
    OXA now defines an AT Protocol lexicon for publishing scientific documents
    to the Atmosphere. The `pub.oxa.*` namespace lets documents live in any
    Personal Data Server, making scientific content user-owned, portable, and
    discoverable alongside social interactions, feeds, and moderation
    infrastructure.
